      const [month, setMonth] = useState('');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [adventureLevel, setAdventureLevel] = useState('all');
      const [units, setUnits] = useState('metric');
      const [results, setResults] = useState(null);
      const [loading, setLoading] = useState(false);

      const convertTemp = (celsius) => {
        if (units === 'imperial') {
          return Math.round((celsius * 9/5) + 32);
        }
        return celsius;
      };

      const convertRainfall = (mm) => {
        if (units === 'imperial') {
          return (mm / 25.4).toFixed(1);
        }
        return mm;
      };

      const getTempUnit = () => units === 'imperial' ? '°F' : '°C';
      const getRainUnit = () => units === 'imperial' ? 'in' : 'mm';
      
      const getPrecipitationType = (avgTemp) => {
        return avgTemp < 2 ? 'snow' : 'rain';
      };
      
      const getPrecipitationLabel = (avgTemp) => {
        return avgTemp < 2 ? 'Snow' : 'Rain';
      };
      
      const getPrecipitationIcon = (avgTemp) => {
        return avgTemp < 2 ? '❄️' : '💧';
      };

      const handleSearch = async () => {
        if (!location) return;
        if (dateType === 'month' && !month) return;
        if (dateType === 'specific' && (!startDate || !endDate)) return;
        
        setLoading(true);
        
        try {
          let searchMonth = month;
          if (dateType === 'specific' && startDate) {
            const date = new Date(startDate);
            searchMonth = date.toLocaleDateString('en-US', { month: 'long' }).toLowerCase();
          }
          
          const prompt = `You are a travel expert. Generate detailed travel recommendations for ${location} in ${searchMonth}.

Provide your response in valid JSON format with this exact structure (no markdown, no backticks, just raw JSON):
{
  "location": "${location}",
  "locationType": "city|state|country",
  "weather": {
    "high": <number in Celsius>,
    "low": <number in Celsius>,
    "rainfall": <number in mm>,
    "humidity": <number as percentage>
  },
  "activities": {
    "adventurous": [
      {"name": "Activity Name", "description": "Brief description", "icon": "emoji", "url": "https://real-url.com"}
    ],
    "calm": [
      {"name": "Activity Name", "description": "Brief description", "icon": "emoji", "url": "https://real-url.com"}
    ],
    "shopping": [
      {"name": "Activity Name", "description": "Brief description", "icon": "emoji", "url": "https://real-url.com"}
    ],
    "nature": [
      {"name": "Activity Name", "description": "Brief description", "icon": "emoji", "url": "https://real-url.com"}
    ]
  },
  "restaurants": [
    {"name": "Restaurant Name", "cuisine": "Type", "price": "$-$$$$$", "rating": 4.5, "url": "https://real-url.com"}
  ]
}

Important instructions:
- Provide 3 activities for each category (adventurous, calm, shopping, nature)
- Provide 5 restaurants with variety in price and cuisine
- Use realistic weather data for ${searchMonth}
- Use real, functional URLs for activities and restaurants (official websites, booking sites, or reputable tour operators)
- Choose appropriate emojis for each activity
- Determine if this is a city, state, or country
- Return ONLY the JSON object, no other text`;

          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 4000,
              messages: [
                { 
                  role: "user", 
                  content: prompt
                }
              ],
            })
          });

          if (!response.ok) {
            throw new Error('Failed to fetch recommendations');
          }

          const data = await response.json();
          
          let responseText = data.content
            .filter(item => item.type === "text")
            .map(item => item.text)
            .join("");
          
          responseText = responseText.replace(/```json\n?|\n?```/g, '').trim();
          
          const locationData = JSON.parse(responseText);
          
          let activities = [];
          if (adventureLevel === 'all') {
            activities = [
              ...(locationData.activities.adventurous || []).slice(0, 2),
              ...(locationData.activities.calm || []).slice(0, 2),
              ...(locationData.activities.shopping || []).slice(0, 1),
              ...(locationData.activities.nature || []).slice(0, 1)
            ];
          } else {
            activities = locationData.activities[adventureLevel] || [];
          }
          
          activities = activities.map(activity => ({
            ...activity,
            level: activity.level || adventureLevel
          }));

            location: locationData.location,
            type: locationData.locationType,
            dateRange: dateType === 'specific'

            weather: locationData.weather,
            activities: activities,
            restaurants: locationData.restaurants
          });

                  </select>
                ) : (
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                    <div>
                      <label style={{
                        display: 'block',
                        marginBottom: '0.4rem',
                        fontSize: '0.8rem',
                        color: 'rgba(255, 255, 255, 0.7)'
                      }}>
                        Start Date
                      </label>
                      <input
                        className="input-field"
                        type="date"
                        value={startDate}
                        onChange={(e) => setStartDate(e.target.value)}
                        style={{
                          width: '100%',
                          padding: '0.875rem 1rem',
                          fontSize: '1rem',
                          border: '1px solid rgba(255, 255, 255, 0.2)',
                          borderRadius: '8px',
                          outline: 'none',
                          backgroundColor: 'rgba(255, 255, 255, 0.05)',
                          color: '#ffffff',
                          fontFamily: 'inherit'
                        }}
                      />
                    </div>
                    <div>
                      <label style={{
                        display: 'block',
                        marginBottom: '0.4rem',
                        fontSize: '0.8rem',
                        color: 'rgba(255, 255, 255, 0.7)'
                      }}>
                        End Date
                      </label>
                      <input
                        className="input-field"
                        type="date"
                        value={endDate}
                        onChange={(e) => setEndDate(e.target.value)}
                        style={{
                          width: '100%',
                          padding: '0.875rem 1rem',
                          fontSize: '1rem',
                          border: '1px solid rgba(255, 255, 255, 0.2)',
                          borderRadius: '8px',
                          outline: 'none',
                          backgroundColor: 'rgba(255, 255, 255, 0.05)',
                          color: '#ffffff',
                          fontFamily: 'inherit'
                        }}
                      />
                    </div>
                  </div>
                )}
              </div>

              <div style={{ marginBottom: '1.5rem' }}>
                <label style={{
                  display: 'block',
                  marginBottom: '0.5rem',
                  fontSize: '0.85rem',
                  fontWeight: '600',
                  color: 'rgba(255, 255, 255, 0.9)',
                  textTransform: 'uppercase',
                  letterSpacing: '0.05em'
                }}>
                  <Mountain size={14} style={{ display: 'inline', marginRight: '0.5rem', verticalAlign: 'middle' }} />
                  Activity Preference
                </label>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: '0.75rem' }}>
                  {[
                    { value: 'all', label: 'All Types', Icon: Compass },
                    { value: 'adventurous', label: 'Adventure', Icon: Mountain },
                    { value: 'calm', label: 'Relaxation', Icon: Coffee },
                    { value: 'shopping', label: 'Shopping', Icon: ShoppingBag },
                    { value: 'nature', label: 'Nature', Icon: Trees }
                  ].map(({ value, label, Icon }) => (
                    <button
                      key={value}
                      onClick={() => setAdventureLevel(value)}
                      style={{
                        padding: '0.75rem 0.5rem',
                        fontSize: '0.85rem',
                        fontWeight: '600',
                        border: `1px solid ${adventureLevel === value ? '#64b5f6' : 'rgba(255, 255, 255, 0.2)'}`,
                        borderRadius: '8px',
                        backgroundColor: adventureLevel === value ? 'rgba(100, 181, 246, 0.15)' : 'rgba(255, 255, 255, 0.05)',
                        color: adventureLevel === value ? '#64b5f6' : 'rgba(255, 255, 255, 0.7)',
                        cursor: 'pointer',
                        fontFamily: 'inherit',
                        display: 'flex',
                        flexDirection: 'column',
                        alignItems: 'center',
                        gap: '0.4rem',
                        transition: 'all 0.2s ease'
                      }}
                    >
                      <Icon size={18} />
                      {label}
                    </button>
                  ))}
                </div>
              </div>

              <button
                className="search-button"
                onClick={handleSearch}
                disabled={loading}
                style={{
                  width: '100%',
                  padding: '1rem',
                  fontSize: '1rem',
                  fontWeight: '700',
                  color: '#ffffff',
                  background: 'linear-gradient(135deg, #64b5f6 0%, #5099cc 100%)',
                  border: 'none',
                  borderRadius: '8px',
                  cursor: loading ? 'not-allowed' : 'pointer',
                  boxShadow: '0 4px 12px rgba(100, 181, 246, 0.3)',
                  opacity: loading ? 0.6 : 1,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  gap: '0.5rem',
                  fontFamily: 'inherit'
                }}
              >
                <Search size={20} />
                {loading ? 'Analyzing Forecast...' : 'Get Forecast'}
              </button>
            </div>

            {/* Results Section */}
            {results && (
              <div>
                <div className="fade-in-up stagger-1" style={{
                  background: 'rgba(255, 255, 255, 0.08)',
                  backdropFilter: 'blur(10px)',
                  borderRadius: '16px',
                  padding: '1.5rem 2rem',
                  marginBottom: '1.5rem',
                  border: '1px solid rgba(255, 255, 255, 0.1)',
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'center',
                  flexWrap: 'wrap',
                  gap: '1rem'
                }}>
                  <div>
                    <h2 style={{
                      fontSize: '2rem',
                      fontWeight: '700',
                      marginBottom: '0.25rem',
                      color: '#ffffff',
                      fontFamily: '"Crimson Pro", serif'
                    }}>
                      {results.location}
                    </h2>
                    <p style={{
                      fontSize: '0.95rem',
                      color: 'rgba(255, 255, 255, 0.7)',
                      margin: 0
                    }}>
                      {results.dateRange} • {results.type.charAt(0).toUpperCase() + results.type.slice(1)}
                    </p>
                  </div>
                  <div style={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: '0.5rem',
                    padding: '0.5rem 1rem',
                    background: 'rgba(100, 181, 246, 0.2)',
                    borderRadius: '8px',
                    border: '1px solid rgba(100, 181, 246, 0.3)'
                  }}>
                    <Camera size={20} style={{ color: '#64b5f6' }} />
                    <span style={{ color: '#64b5f6', fontWeight: '600', fontSize: '0.9rem' }}>
                      {adventureLevel === 'all' ? 'All Activities' : adventureLevel.charAt(0).toUpperCase() + adventureLevel.slice(1)}
                    </span>
                  </div>
                </div>

                {/* Weather Card */}
                <div className="fade-in-up stagger-2" style={{
                  background: 'rgba(255, 255, 255, 0.08)',
                  backdropFilter: 'blur(10px)',
                  borderRadius: '16px',
                  padding: '2rem',
                  marginBottom: '1.5rem',
                  border: '1px solid rgba(255, 255, 255, 0.1)'
                }}>
                  <h3 style={{
                    fontSize: '1.3rem',
                    fontWeight: '700',
                    marginBottom: '1.5rem',
                    color: '#ffffff',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '0.5rem'
                  }}>
                    <Cloud size={24} style={{ color: '#64b5f6' }} />
                    Weather Forecast
                  </h3>

                  <div style={{
                    display: 'grid',
                    gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))',
                    gap: '1rem'
                  }}>
                    <div style={{
                      padding: '1.25rem',
                      background: 'linear-gradient(135deg, rgba(255, 152, 0, 0.2) 0%, rgba(255, 87, 34, 0.2) 100%)',
                      borderRadius: '12px',
                      border: '1px solid rgba(255, 152, 0, 0.3)',
                      textAlign: 'center'
                    }}>
                      <ThermometerSun size={28} style={{ marginBottom: '0.5rem', color: '#ff9800' }} />
                      <div style={{
                        fontSize: '1.75rem',
                        fontWeight: '700',
                        marginBottom: '0.25rem',
                        color: '#ffffff'
                      }}>
                        {convertTemp(results.weather.high)}{getTempUnit()}
                      </div>
                      <div style={{
                        fontSize: '0.8rem',
                        color: 'rgba(255, 255, 255, 0.7)',
                        textTransform: 'uppercase',
                        letterSpacing: '0.05em',
                        fontWeight: '600'
                      }}>
                        High
                      </div>
                    </div>

                    <div style={{
                      padding: '1.25rem',
                      background: 'linear-gradient(135deg, rgba(33, 150, 243, 0.2) 0%, rgba(3, 169, 244, 0.2) 100%)',
                      borderRadius: '12px',
                      border: '1px solid rgba(33, 150, 243, 0.3)',
                      textAlign: 'center'
                    }}>
                      <Cloud size={28} style={{ marginBottom: '0.5rem', color: '#2196f3' }} />
                      <div style={{
                        fontSize: '1.75rem',
                        fontWeight: '700',
                        marginBottom: '0.25rem',
                        color: '#ffffff'
                      }}>
                        {convertTemp(results.weather.low)}{getTempUnit()}
                      </div>
                      <div style={{
                        fontSize: '0.8rem',
                        color: 'rgba(255, 255, 255, 0.7)',
                        textTransform: 'uppercase',
                        letterSpacing: '0.05em',
                        fontWeight: '600'
                      }}>
                        Low
                      </div>
                    </div>

                    <div style={{
                      padding: '1.25rem',
                      background: 'linear-gradient(135deg, rgba(0, 188, 212, 0.2) 0%, rgba(0, 150, 136, 0.2) 100%)',
                      borderRadius: '12px',
                      border: '1px solid rgba(0, 188, 212, 0.3)',
                      textAlign: 'center'
                    }}>
                      <div style={{ marginBottom: '0.5rem', fontSize: '1.75rem' }}>
                        {getPrecipitationIcon((results.weather.high + results.weather.low) / 2)}
                      </div>
                      <div style={{
                        fontSize: '1.75rem',
                        fontWeight: '700',
                        marginBottom: '0.25rem',
                        color: '#ffffff'
                      }}>
                        {convertRainfall(results.weather.rainfall)}{getRainUnit()}
                      </div>
                      <div style={{
                        fontSize: '0.8rem',
                        color: 'rgba(255, 255, 255, 0.7)',
                        textTransform: 'uppercase',
                        letterSpacing: '0.05em',
                        fontWeight: '600'
                      }}>
                        {getPrecipitationLabel((results.weather.high + results.weather.low) / 2)}
                      </div>
                    </div>

                    <div style={{
                      padding: '1.25rem',
                      background: 'linear-gradient(135deg, rgba(156, 39, 176, 0.2) 0%, rgba(103, 58, 183, 0.2) 100%)',
                      borderRadius: '12px',
                      border: '1px solid rgba(156, 39, 176, 0.3)',
                      textAlign: 'center'
                    }}>
                      <Wind size={28} style={{ marginBottom: '0.5rem', color: '#9c27b0' }} />
                      <div style={{
                        fontSize: '1.75rem',
                        fontWeight: '700',
                        marginBottom: '0.25rem',
                        color: '#ffffff'
                      }}>
                        {results.weather.humidity}%
                      </div>
                      <div style={{
                        fontSize: '0.8rem',
                        color: 'rgba(255, 255, 255, 0.7)',
                        textTransform: 'uppercase',
                        letterSpacing: '0.05em',
                        fontWeight: '600'
                      }}>
                        Humidity
                      </div>
                    </div>
                  </div>
                </div>

                {/* Activities Section */}
                <div className="fade-in-up stagger-3" style={{
                  background: 'rgba(255, 255, 255, 0.08)',
                  backdropFilter: 'blur(10px)',
                  borderRadius: '16px',
                  padding: '2rem',
                  marginBottom: '1.5rem',
                  border: '1px solid rgba(255, 255, 255, 0.1)'
                }}>
                  <h3 style={{
                    fontSize: '1.3rem',
                    fontWeight: '700',
                    marginBottom: '1.5rem',
                    color: '#ffffff',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '0.5rem'
                  }}>
                    <Compass size={24} style={{ color: '#64b5f6' }} />
                    Recommended Activities
                  </h3>

                  <div style={{
                    display: 'grid',
                    gap: '1rem'
                  }}>
                    {results.activities.map((activity, index) => (
                      <a
                        key={index}
                        href={activity.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="hover-lift"
                        style={{
                          display: 'flex',
                          alignItems: 'center',
                          gap: '1.25rem',
                          padding: '1.25rem',
                          background: 'rgba(255, 255, 255, 0.05)',
                          borderRadius: '12px',
                          border: '1px solid rgba(255, 255, 255, 0.1)',
                          textDecoration: 'none',
                          color: 'inherit',
                          cursor: 'pointer'
                        }}
                      >
                        <div style={{
                          fontSize: '2rem',
                          flexShrink: 0,
                          width: '50px',
                          height: '50px',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'center',
                          background: 'rgba(100, 181, 246, 0.1)',
                          borderRadius: '10px',
                          border: '1px solid rgba(100, 181, 246, 0.2)'
                        }}>
                          {activity.icon}
                        </div>
                        <div style={{ flex: 1 }}>
                          <div style={{
                            fontSize: '1.1rem',
                            fontWeight: '600',
                            marginBottom: '0.25rem',
                            color: '#ffffff',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '0.5rem'
                          }}>
                            {activity.name}
                            <ExternalLink size={16} style={{ color: '#64b5f6', opacity: 0.7 }} />
                          </div>
                          <div style={{
                            fontSize: '0.9rem',
                            color: 'rgba(255, 255, 255, 0.6)',
                            lineHeight: '1.5'
                          }}>
                            {activity.description}
                          </div>
                        </div>
                        <div style={{
                          padding: '0.4rem 0.75rem',
                          background: 'rgba(100, 181, 246, 0.15)',
                          borderRadius: '6px',
                          fontSize: '0.75rem',
                          fontWeight: '600',
                          color: '#64b5f6',
                          textTransform: 'uppercase',
                          letterSpacing: '0.05em',
                          whiteSpace: 'nowrap'
                        }}>
                          {activity.level}
                        </div>
                      </a>
                    ))}
                  </div>
                </div>

                {/* Restaurants Section */}
                <div className="fade-in-up stagger-4" style={{
                  background: 'rgba(255, 255, 255, 0.08)',
                  backdropFilter: 'blur(10px)',
                  borderRadius: '16px',
                  padding: '2rem',
                  border: '1px solid rgba(255, 255, 255, 0.1)'
                }}>
                  <h3 style={{
                    fontSize: '1.3rem',
                    fontWeight: '700',
                    marginBottom: '1.5rem',
                    color: '#ffffff',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '0.5rem'
                  }}>
                    <Utensils size={24} style={{ color: '#64b5f6' }} />
                    Where to Eat
                  </h3>

                  <div style={{
                    display: 'grid',
                    gap: '1rem'
                  }}>
                    {results.restaurants.map((restaurant, index) => (
                      <a
                        key={index}
                        href={restaurant.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="hover-lift"
                        style={{
                          display: 'flex',
                          justifyContent: 'space-between',
                          alignItems: 'center',
                          padding: '1.25rem',
                          background: 'rgba(255, 255, 255, 0.05)',
                          borderRadius: '12px',
                          border: '1px solid rgba(255, 255, 255, 0.1)',
                          textDecoration: 'none',
                          color: 'inherit',
                          cursor: 'pointer'
                        }}
                      >
                        <div>
                          <div style={{
                            fontSize: '1.1rem',
                            fontWeight: '600',
                            marginBottom: '0.25rem',
                            color: '#ffffff',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '0.5rem'
                          }}>
                            {restaurant.name}
                            <ExternalLink size={16} style={{ color: '#64b5f6', opacity: 0.7 }} />
                          </div>
                          <div style={{
                            fontSize: '0.9rem',
                            color: 'rgba(255, 255, 255, 0.6)'
                          }}>
                            {restaurant.cuisine} • {restaurant.price}
                          </div>
                        </div>
                        <div style={{
                          fontSize: '1rem',
                          fontWeight: '700',
                          color: '#ffa726',
                          display: 'flex',
                          alignItems: 'center',
                          gap: '0.25rem',
                          padding: '0.5rem 0.75rem',
                          background: 'rgba(255, 167, 38, 0.15)',
                          borderRadius: '8px'
                        }}>
                          ⭐ {restaurant.rating}
                        </div>
                      </a>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Empty State */}
            {!results && !loading && (
              <div style={{
                background: 'rgba(255, 255, 255, 0.08)',
                backdropFilter: 'blur(10px)',
                borderRadius: '16px',
                padding: '4rem 2rem',
                textAlign: 'center',
                border: '1px solid rgba(255, 255, 255, 0.1)'
              }}>
                <div style={{
                  fontSize: '4rem',
                  marginBottom: '1rem',
                  opacity: 0.7
                }}>
                  🗺️
                </div>
                <h3 style={{
                  fontSize: '1.8rem',
                  fontWeight: '700',
                  marginBottom: '0.75rem',
                  color: '#ffffff',
                  fontFamily: '"Crimson Pro", serif'
                }}>
                  Ready to Plan Your Trip?
                </h3>
                <p style={{
                  fontSize: '1rem',
                  color: 'rgba(255, 255, 255, 0.7)',
                  maxWidth: '500px',
                  margin: '0 auto',
                  lineHeight: '1.6'
                }}>
                  Enter your destination and travel dates to get detailed weather forecasts and personalized activity recommendations based on your preferences.
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TripForecast />);
  </script>
</body>
</html>
